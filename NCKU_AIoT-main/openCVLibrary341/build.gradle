apply plugin: 'com.android.library'

android {
    compileSdk = 27

    namespace 'org.opencv'

    defaultConfig {
        minSdkVersion 16
        targetSdkVersion 30
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}
